    <!-- The thesis in one small, honest demo: nothing moves until the visitor presses the button -->
    <figure class="specimen">
      <div class="specimen-window">
        <div class="specimen-bar">
          <span class="specimen-url" data-t="specimen.url"></span>
          <span class="specimen-visit" id="specVisit"></span>
        </div>
        <div class="shop" id="specShop" data-visit="1" aria-hidden="true">
          <div class="shop-top"><span class="shop-brand" data-t="specimen.brand"></span></div>
          <div class="shop-img">
            <svg viewBox="0 0 120 80"><path d="M38 52V44a22 22 0 0 1 44 0v8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><rect x="31" y="47" width="13" height="21" rx="6" fill="currentColor"/><rect x="76" y="47" width="13" height="21" rx="6" fill="currentColor"/></svg>
          </div>
          <p class="shop-name" data-t="specimen.product"></p>
          <p class="shop-price"><span data-t="specimen.price"></span><span class="shop-stock" data-t="specimen.stock"></span></p>
          <span class="shop-btn shop-cart" id="specCart" data-t="specimen.cart"></span>
          <span class="shop-btn shop-extra" id="specExtra" data-t="specimen.extra"></span>
          <span class="shop-save" data-t="specimen.save"></span>
        </div>
      </div>
      <figcaption class="specimen-caption">
        <span class="label" data-t="specimen.fig"></span>
        <span id="specCaption"></span>
      </figcaption>
      <button type="button" class="btn btn-ghost specimen-btn" id="specBtn"></button>

          </div>
