<section id="contact" class="sec band">

      <ul class="contact-socials" id="socialLinks"></ul>
    </div>
    <form class="contact-form" id="contactForm" novalidate>
      <!-- Honeypot: Formspree drops any submission that fills _gotcha; humans never see or reach it -->
      <div class="hp-field" aria-hidden="true">
        <label for="cf-gotcha">Laat dit veld leeg / Leave this field empty</label>
        <input id="cf-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="field">
        <label for="cf-name" data-t="contact.name"></label>
        <input id="cf-name" name="name" type="text" required autocomplete="name">
      </div>
      <div class="field">
        <label for="cf-email" data-t="contact.email"></label>
        <input id="cf-email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="cf-message" data-t="contact.message"></label>
        <textarea id="cf-message" name="message" required rows="6"></textarea>
      </div>
      <div class="form-foot">
        <button class="btn btn-primary" type="submit" data-t="contact.send"></button>
        <p class="form-status" id="formStatus" role="status"></p>
      </div>
    </form>
