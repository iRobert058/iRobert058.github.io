<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Robert Karzijn</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
<!-- Absolute paths: GitHub Pages serves this page at whatever URL was missing -->
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/hanken-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="simple">

<header class="bar">
  <div class="bar-inner">
    <a class="wordmark bar-group" href="/" data-home><span class="wordmark-mark" aria-hidden="true">RK</span><span>Robert Karzijn</span></a>
    <div class="seg glass" role="group" aria-label="Taal / Language">
      <button type="button" data-lang="nl" lang="nl" aria-pressed="true">NL</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="simple-main">
  <div class="wrap">
    <p class="label" data-t="code">Foutcode 404</p>
    <h1 data-t="title">Deze pagina bestaat niet.</h1>
    <p class="lead" data-t="lead">Een interface-element dat zich niet gedraagt zoals verwacht - toevallig mijn onderzoeksgebied.</p>
    <a class="btn btn-primary" href="/" data-home data-t="btn">Terug naar home</a>
  </div>
</main>

<script>
  (function () {
    var dict = {
      nl: {
        code: "Foutcode 404",
        title: "Deze pagina bestaat niet.",
        lead: "Een interface-element dat zich niet gedraagt zoals verwacht - toevallig mijn onderzoeksgebied.",
        btn: "Terug naar home",
        pageTitle: "404 - Robert Karzijn"
      },
      en: {
        code: "Error 404",
        title: "This page doesn't exist.",
        lead: "An interface element that doesn't behave as expected - fittingly, my field of research.",
        btn: "Back to home",
        pageTitle: "404 - Robert Karzijn"
      }
    };
    var langBtns = document.querySelectorAll("[data-lang]");

    // Dutch by default; the choice isn't stored anywhere
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.title = dict[lang].pageTitle;
      langBtns.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      document.querySelectorAll("[data-t]").forEach(function (el) {
        el.textContent = dict[lang][el.dataset.t];
      });
    }

    // English lives in the URL (?lang=en), like on the other pages; nothing is stored
    function homeLinks(lang) {
      document.querySelectorAll("[data-home]").forEach(function (a) {
        a.setAttribute("href", lang === "en" ? "/?lang=en" : "/");
      });
    }
    var initial = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "nl";
    if (initial === "en") applyLang("en");
    homeLinks(initial);

    langBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyLang(btn.dataset.lang);
        homeLinks(btn.dataset.lang);
        history.replaceState(null, "", location.pathname + (btn.dataset.lang === "en" ? "?lang=en" : "") + location.hash);
      });
    });
  })();
</script>

</body>
</html>
