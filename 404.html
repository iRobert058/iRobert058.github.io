<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Robert Karzijn</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
<!-- Absolute paths: GitHub Pages serves this page at whatever URL was missing -->
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  .nf { min-height: calc(100svh - var(--nav-h)); display: grid; align-content: center; padding: var(--space-8) 0; }
  .topbar .lang-switch { margin-left: auto; }
  .nf .label { color: var(--accent-strong); }
  .nf h1 {
    font-family: var(--font-display); font-weight: 600; letter-spacing: var(--tracking-display);
    font-size: var(--fs-h2); line-height: 1.05; margin: var(--space-4) 0 var(--space-5); max-width: 18ch;
  }
  .nf p { color: var(--muted); font-size: var(--fs-lg); max-width: 52ch; margin-bottom: var(--space-7); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="/"><span class="wordmark-mark" aria-hidden="true">RK</span><span>Robert Karzijn</span></a>
    <div class="lang-switch" role="group" aria-label="Taal / Language">
      <button type="button" data-lang="nl" lang="nl" aria-pressed="true">NL</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main class="nf">
  <div class="wrap">
    <p class="label" data-t="code">Foutcode 404</p>
    <h1 data-t="title">Deze pagina bestaat niet.</h1>
    <p data-t="lead">Een interface-element dat zich niet gedraagt zoals verwacht - toevallig mijn onderzoeksgebied.</p>
    <a class="btn btn-primary" href="/" data-t="btn">Terug naar home</a>
  </div>
</main>

<script>
  (function () {
    var dict = {
      nl: {
        code: "Foutcode 404",
        title: "Deze pagina bestaat niet.",
        lead: "Een interface-element dat zich niet gedraagt zoals verwacht - toevallig mijn onderzoeksgebied.",
        btn: "Terug naar home",
        pageTitle: "404 - Robert Karzijn"
      },
      en: {
        code: "Error 404",
        title: "This page doesn't exist.",
        lead: "An interface element that doesn't behave as expected - fittingly, my field of research.",
        btn: "Back to home",
        pageTitle: "404 - Robert Karzijn"
      }
    };
    var langBtns = document.querySelectorAll("[data-lang]");

    // Dutch by default; the choice isn't stored anywhere
    function applyLang(lang) {
      document.documentElement.lang = lang;
      document.title = dict[lang].pageTitle;
      langBtns.forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang));
      });
      document.querySelectorAll("[data-t]").forEach(function (el) {
        el.textContent = dict[lang][el.dataset.t];
      });
    }

    langBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyLang(btn.dataset.lang);
      });
    });
  })();
</script>

</body>
</html>
